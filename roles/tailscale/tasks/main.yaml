---
- name: Remove legacy Tailscale apt repo
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Install Tailscale apt repo
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    install_python_debian: true
    state: present

- name: Install tailscale
  ansible.builtin.package:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Get Tailscale prefs
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Allow Tailscale operator to manage tailscale without root
  ansible.builtin.command: "tailscale set --operator={{ tailscale_operator }}"
  changed_when: true
  when: (tailscale_prefs.stdout | from_json).OperatorUser | default('') != tailscale_operator

- name: Set whether Tailscale manages DNS
  ansible.builtin.command: "tailscale set --accept-dns={{ tailscale_accept_dns | lower }}"
  changed_when: true
  when: (tailscale_prefs.stdout | from_json).CorpDNS | default(true) != tailscale_accept_dns

- name: Write resolv.conf when Tailscale does not manage DNS
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      {% for server in tailscale_nameservers %}
      nameserver {{ server }}
      {% endfor %}
      {% if tailscale_search_domains | length > 0 %}
      search {{ tailscale_search_domains | join(' ') }}
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  when:
    - not tailscale_accept_dns
    - tailscale_nameservers | length > 0
