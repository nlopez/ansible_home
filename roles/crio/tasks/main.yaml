---
- name: Add cri-o package signing key
  apt_key:
    url: https://pkgs.k8s.io/core:/stable:/{{ crio_kubernetes_version }}/deb/Release.key

- name: Add cri-o apt repo
  apt_repository:
    repo: deb https://pkgs.k8s.io/addons:/cri-o:/stable:/{{ crio_kubernetes_version }}/deb/ /
    filename: cri-o

- name: Install CRI-O packages
  package:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - cri-o
      - cri-o-runc

- name: Configure CRI-O
  template:
    src: crio.conf.j2
    dest: /etc/crio/crio.conf
    owner: root
    group: root
    mode: '0644'

- name: Create cni net.d dir
  file:
    dest: /etc/cni/net.d/
    state: directory
    mode: '0755'
    owner: root
    group: root

# - name: Configure CRI-O bridge
#   template:
#     src: crio-bridge.conf.j2
#     dest: /etc/cni/net.d/100-crio-bridge.conf
#     owner: root
#     group: root
#     mode: '0644'

- name: Start and enable CRI-O
  service:
    name: crio
    enabled: true
    state: started
    daemon_reload: true
