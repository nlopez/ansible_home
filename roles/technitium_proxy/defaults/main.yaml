---
# Public hostname served by the proxy. The role is a no-op when empty.
technitium_proxy_hostname: ""
technitium_proxy_upstream: http://127.0.0.1:5380

technitium_proxy_acme_email: ""
technitium_proxy_acme_server: https://acme-v02.api.letsencrypt.org/directory
# Let's Encrypt "shortlived" profile issues 6-day certificates.
technitium_proxy_acme_profile: shortlived
# Public resolvers lego uses to confirm the DNS-01 TXT record. The gateway
# redirects other LAN hosts' port-53 traffic to Technitium, whose negative cache
# hides new records, so this relies on the Technitium hosts being exempt.
technitium_proxy_dns_resolvers:
  - 1.1.1.1:53
  - 1.0.0.1:53
# Renew when this many days of validity remain (certs live 6 days).
technitium_proxy_renew_days: 2
technitium_proxy_renew_schedule: "*-*-* 00/6:00:00"

# Cloudflare token scoped to Zone Read + DNS Write on the zone, read from
# 1Password on the controller so it never lands in the repo.
technitium_proxy_cloudflare_token: >-
  {{ lookup('ansible.builtin.pipe',
  'op read op://evjh25ux2mnoufaut6qhvm2pdi/hhavah2oykbdagc7krfb3kjdsq/credential --account my.1password.com') }}

technitium_proxy_lego_version: 5.6.0
technitium_proxy_lego_checksum: sha256:34d87a6552d69390c4a4560237045c47713a8e148d899e16db0e97040894ed1f
technitium_proxy_lego_dir: /var/lib/lego
