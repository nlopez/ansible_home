---
- name: Install the NetFlow v9 relay
  ansible.builtin.copy:
    src: netflow9_fixup.py
    dest: /usr/local/bin/netflow9_fixup.py
    mode: "0755"
  notify: restart netflow9-fixup

- name: Install the NetFlow v9 relay unit
  ansible.builtin.template:
    src: netflow9-fixup.service.j2
    dest: /etc/systemd/system/netflow9-fixup.service
    mode: "0644"
  notify:
    - reload systemd
    - restart netflow9-fixup

# The relay forwards with the exporter's source address, which strict reverse
# path filtering would drop on its way back in through loopback.
- name: Relax reverse path filtering for the relay
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-netflow9-fixup.conf
    content: |
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0
      net.ipv4.conf.lo.rp_filter = 0
      net.ipv4.conf.{{ ansible_facts['default_ipv4']['interface'] }}.rp_filter = 0
    mode: "0644"
  notify: reload sysctl

- name: Flush handlers so the relay is up before the agent
  ansible.builtin.meta: flush_handlers

- name: Enable the NetFlow v9 relay
  ansible.builtin.systemd:
    name: netflow9-fixup
    enabled: true
    state: started
