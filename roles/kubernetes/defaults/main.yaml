---
kubernetes_packages:
  - kubelet=1.36.3-1.1
  - kubeadm=1.36.3-1.1
  - kubectl=1.36.3-1.1
  - kubernetes-cni=1.4.0-1.1

kubernetes_stale_repo_versions:
  - v1.33
  - v1.34
  - v1.35

kubernetes_other_packages:
kubernetes_keepalived_interface: eno1
  - ipset  # needed for ipvs

kubernetes_vip: 192.168.222.245

kubernetes_sysctls:
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  net.ipv4.ip_nonlocal_bind: 1
