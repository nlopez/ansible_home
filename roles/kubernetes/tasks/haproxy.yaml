---
- name: Install haproxy
  ansible.builtin.package:
    name: haproxy
    state: present

- name: Configure haproxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart haproxy

- name: Enable and start haproxy
  ansible.builtin.service:
    name: haproxy
    enabled: true
    state: started
