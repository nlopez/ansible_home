---
- name: Set Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/70-k8s.conf
    ignoreerrors: true # ignores unknown key errors
  loop: "{{ lookup('dict', kubernetes_sysctls, wantlist=true) }}"

- name: Configure Cilium sysctl overrides
  ansible.builtin.copy:
    content: |
      # Disable rp_filter on Cilium interfaces since it may cause mangled packets to be dropped
      -net.ipv4.conf.lxc*.rp_filter = 0
      -net.ipv4.conf.cilium_*.rp_filter = 0
      # The kernel uses max(conf.all, conf.{dev}) as its value, so we need to set .all. to 0 as well.
      # Otherwise it would overrule the device specific settings.
      net.ipv4.conf.all.rp_filter = 0
    dest: /etc/sysctl.d/99-zzz-override_cilium.conf
    owner: root
    group: root
    mode: '0644'

- name: Install Google Cloud Packages Automatic Signing Key
  ansible.builtin.apt_key:
    # The same signing key is used for all repositories, so you can disregard the version in the URL
    url: 'https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key'
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present

- name: Install Kubernetes apt repo
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /'
    filename: kubernetes
    state: present
    update_cache: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Pin versions on Kubernetes packages
  ansible.builtin.template:
    src: kubernetes_apt_pins
    dest: /etc/apt/preferences.d/kubernetes
    owner: root
    group: root
    mode: '0644'

- name: Install Kubernetes packages
  ansible.builtin.package:
    name: "{{ kubernetes_packages }}"
    force: true
    state: present

- name: Install supporting Kubernetes packages
  ansible.builtin.package:
    name: "{{ kubernetes_other_packages }}"
    state: present

- name: Configure kubelet for containerd
  ansible.builtin.template:
    src: etc_default_kubelet
    dest: /etc/default/kubelet
    mode: '0640'

- name: Start and enable Kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
    state: started

- name: Configure haproxy in front of kube-apiserver
  ansible.builtin.include_tasks: haproxy.yaml

- name: Configure keepalived vrrp for stacked Kubernetes masters
  ansible.builtin.include_tasks: keepalived.yaml
