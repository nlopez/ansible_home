---
# Tailscale routes all of 100.64.0.0/10 into tailscale0 (table 52), so a host
# running it sends replies to tailnet clients out that interface instead of
# back through the subnet router, and non-SNAT subnet routing breaks.
- name: Stop and disable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    state: stopped
    enabled: false
  register: tailscale_absent_stop
  failed_when:
    - tailscale_absent_stop.failed | default(false)
    - "'Could not find' not in (tailscale_absent_stop.msg | default(''))"

- name: Remove tailscale
  ansible.builtin.package:
    name: tailscale
    state: absent

- name: Remove Tailscale apt repo
  ansible.builtin.deb822_repository:
    name: tailscale
    state: absent
